<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/web/images/cash.ico" rel="icon" type="image/x-icon">
    <title>{{block "title" .}}{{end}} $ Cash Tracker</title>
    <link href="/web/css/app.css" rel=stylesheet>
    <script type="module" src="/web/js/app.js"></script>
    <link href="/web/manifest.json" rel="manifest">
    <style>
        @import url("/web/css/pico.min.css") layer(base);
    </style>
</head>

<body class="pico container">

    <header>
        <nav role="navigation" data-breakpoint="md">
            <ul>
                <li>
                    <a href="/app/transactions/edit/">
                        <img src="/web/images/cash.svg" style="height:2.5em;min-width:2.5em;"
                            alt="Cash Tracker Logo"></img>
                    </a>
                </li>
                {{if not .loggedOut}}
                <li id="sync" hidden>
                    <form action="/sw/sync/" method="post">
                        <button>Sync Data</button>
                    </form>
                </li>
                {{end}}
            </ul>
            {{if not .loggedOut}}
            <input type="checkbox" id="hamburger" />
            <label class="fs-1" for="hamburger">&#x2261;</label>
            <ul role="list">
                <li role="listitem"><a href="/app/transactions/edit/">New</a></li>
                <li role="listitem"><a href="/app/transactions/">Transactions</a></li>
                <li role="listitem"><a href="/app/categories/">Categories</a></li>
                <li role="listitem"><a href="/app/export/">Export</a></li>
                <li role="listitem">
                    <a href="/app/settings/" aria-label="Settings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1.25rem" height="1.25rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.25em">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </a>
                </li>
                <li role="listitem"><a href="/app/logout/">Logout</a></li>
            </ul>
            {{end}}
        </nav>
        {{block "header" .}}<h2>Cash</h2>{{end}}
    </header>

    <main> {{block "main" .}}{{end}} </main>

    <footer></footer>

</body>

</html>
